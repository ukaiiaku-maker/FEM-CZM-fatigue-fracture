[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-czm-fatigue-fracture"
version = "0.2.0"
description = "Analysis utilities for Arrhenius FEM/CZM fracture and fatigue campaigns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fem-czm-plot-k-vs-t = "fem_czm_analysis.k_vs_t:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
