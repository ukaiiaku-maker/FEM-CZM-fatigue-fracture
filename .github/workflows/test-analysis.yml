name: Test FEM-CZM campaign analysis

on:
  push:
    branches: [analysis-k-vs-t-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile analysis package
        run: python -m py_compile src/fem_czm_analysis/k_vs_t.py
      - name: Run tests
        run: pytest -q
      - name: Check installed CLI
        run: fem-czm-plot-k-vs-t --help
